site_name: "Claude Code Notes"
site_description: "A practical reference for engineers using Claude Code — from safe first sessions through customization, automation, integrations, plugins, and troubleshooting."

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Basics:
      - basics/index.md
      - "Getting Started": basics/01_getting_started.md
      - "Sessions and Core CLI": basics/02_sessions_and_cli.md
  - Rules:
      - rules/index.md
      - "CLAUDE.md": rules/01_claude_md.md
  - Settings:
      - settings/index.md
      - "settings.json": settings/01_settings_json.md
      - "`.claude/` Directory": settings/02_claude_directory.md
  - Commands:
      - commands/index.md
      - "Custom Commands": commands/01_custom_commands.md
  - Skills:
      - skills/index.md
      - "Skills Overview": skills/01_skills_overview.md
      - "Advanced Skills": skills/02_skills_advanced.md
  - Operations:
      - operations/index.md
      - "Troubleshooting": operations/01_troubleshooting.md
  - GitHub:
      - github/index.md
      - "GitHub App": github/01_github_app.md
      - "GitHub Actions": github/02_github_actions.md
      - "Workflow Recipes": github/03_workflow_recipes.md
  - Hooks:
      - hooks/index.md
      - "Hooks Overview": hooks/01_hooks_overview.md
      - "Hook Handlers": hooks/02_hook_handlers.md
  - MCP:
      - mcp/index.md
      - ".mcp.json": mcp/01_mcp_json.md
  - Agents:
      - agents/index.md
      - "Subagents": agents/01_subagents.md
  - Plugins:
      - plugins/index.md
      - "Plugin Fundamentals": plugins/01_plugin_fundamentals.md
      - "Install & Scopes": plugins/02_install_and_scopes.md
      - "Marketplaces": plugins/03_marketplaces.md
      - "Managing Plugins": plugins/04_managing_plugins.md
